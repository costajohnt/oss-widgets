name: Remove Vercel project
on: workflow_dispatch
jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Confirm project is oss-widgets, then delete it
        run: |
          set -euo pipefail
          api="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          name=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$api" | jq -r .name)
          echo "project name: $name"
          test "$name" = "oss-widgets"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" "$api")
          echo "delete status: $code"
          test "$code" = "204" || test "$code" = "200"
          after=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "$api")
          echo "lookup after delete: $after"
          test "$after" = "404"
